<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>RAFATOR — O Exterminador</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    overflow: hidden;
    background: #000;
    font-family: 'Courier New', monospace;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    color: #ff3030;
  }
  canvas { display: block; margin: 0 auto; image-rendering: pixelated; }
  #hud {
    position: fixed; top: 12px; left: 12px; right: 12px;
    display: flex; justify-content: space-between; align-items: center;
    pointer-events: none; z-index: 10; gap: 12px; flex-wrap: wrap;
  }
  .hud-pill {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(0, 0, 0, 0.75);
    border: 1px solid #ff3030;
    padding: 6px 14px;
    color: #ff3030;
    font-size: 16px;
    font-weight: bold;
    text-shadow: 0 0 6px #ff0000;
    box-shadow: 0 0 10px rgba(255, 48, 48, 0.4);
    letter-spacing: 2px;
  }
  .bar {
    width: 200px; height: 14px;
    background: rgba(60,0,0,0.5);
    border: 1px solid #ff3030;
    position: relative;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%; background: linear-gradient(90deg, #ff0000, #ff5050);
    transition: width 0.2s;
    box-shadow: 0 0 8px #ff0000;
  }
  .bar-label {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; color: #fff; font-weight: bold;
    text-shadow: 1px 1px 0 #000;
  }
  #message {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0, 0, 0, 0.92);
    padding: 30px 44px;
    border: 2px solid #ff3030;
    text-align: center;
    box-shadow: 0 0 40px rgba(255, 0, 0, 0.6), inset 0 0 20px rgba(255, 0, 0, 0.1);
    z-index: 20;
    max-width: 620px;
  }
  #message h1 {
    color: #ff3030; font-size: 36px; margin-bottom: 14px;
    text-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000;
    letter-spacing: 6px;
  }
  #message p { color: #ddd; font-size: 15px; line-height: 1.6; margin-bottom: 8px; }
  #message .quote { color: #ff5050; font-style: italic; font-size: 14px; }
  #msg-button {
    margin-top: 18px; padding: 12px 36px;
    background: #000; color: #ff3030;
    border: 2px solid #ff3030;
    border-radius: 0;
    font-size: 18px; font-weight: bold; cursor: pointer;
    font-family: inherit;
    letter-spacing: 3px;
    text-transform: uppercase;
    box-shadow: 0 0 12px rgba(255, 48, 48, 0.4);
    transition: all 0.15s;
  }
  #msg-button:hover {
    background: #ff3030; color: #000;
    box-shadow: 0 0 20px rgba(255, 48, 48, 0.8);
  }
  .controls {
    position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.75);
    padding: 6px 16px;
    border: 1px solid #ff3030;
    color: #ff3030; font-size: 12px;
    pointer-events: none; z-index: 10;
    box-shadow: 0 0 8px rgba(255, 48, 48, 0.3);
    white-space: nowrap;
  }
  .key {
    display: inline-block; padding: 1px 6px; background: #1a0000;
    border: 1px solid #ff3030;
    color: #ff3030; font-weight: bold; margin: 0 1px;
  }
  .scanline {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(
      0deg,
      rgba(0,0,0,0) 0px,
      rgba(0,0,0,0) 2px,
      rgba(0,0,0,0.15) 3px,
      rgba(0,0,0,0) 4px
    );
    pointer-events: none;
    z-index: 5;
    mix-blend-mode: multiply;
  }
  .vignette {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    box-shadow: inset 0 0 200px rgba(180, 0, 0, 0.4);
    pointer-events: none;
    z-index: 4;
  }
  .hidden { display: none !important; }
  #flash {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: #ff0000;
    pointer-events: none;
    z-index: 100;
    opacity: 0;
  }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720"></canvas>
<div class="scanline"></div>
<div class="vignette"></div>
<div id="flash"></div>
<div id="hud">
  <div class="hud-pill">// RAFATOR //</div>
  <div style="display:flex; gap:10px; flex-wrap: wrap;">
    <div class="hud-pill">
      HP
      <div class="bar"><div class="bar-fill" id="hp-bar"></div><div class="bar-label" id="hp-text">100/100</div></div>
    </div>
    <div class="hud-pill">ARMAS <span id="ammo">∞</span></div>
    <div class="hud-pill">KILLS <span id="kills">0</span></div>
    <div class="hud-pill">WAVE <span id="wave">1</span></div>
  </div>
</div>
<div class="controls">
  <span class="key">←</span> <span class="key">→</span> mover &nbsp;
  <span class="key">↑</span> saltar &nbsp;
  <span class="key">↓</span> agachar &nbsp;
  <span class="key">Z</span>/<span class="key">J</span> disparar &nbsp;
  <span class="key">X</span>/<span class="key">K</span> granada &nbsp;
  <span class="key">C</span>/<span class="key">L</span> faca &nbsp;
  <span class="key">R</span> recomeçar &nbsp;
  <span class="key">X</span> sair
</div>
<div id="message">
  <h1 id="msg-title">// SKYNET //</h1>
  <p id="msg-text">A guerra começou. As máquinas tomaram o controlo.</p>
  <p class="quote">"Eu voltarei."</p>
  <button id="msg-button">Iniciar missão</button>
</div>
<script>
'use strict';

// =============================================================
//  RAFATOR — Acção side-scrolling inspirada no Terminator
//  Estética ocre/vermelha pós-apocalíptica. Sem pixel art, vector.
// =============================================================

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;

// ---------- Audio ----------
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function noiseBurst(dur, vol = 0.05) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * dur, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
  const s = audioCtx.createBufferSource();
  s.buffer = buf;
  const g = audioCtx.createGain();
  g.gain.value = vol;
  s.connect(g); g.connect(audioCtx.destination);
  s.start(t);
}
function tone(freq, dur, type = 'sawtooth', vol = 0.05, when = 0) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime + when;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.005);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(t); o.stop(t + dur);
}
function sfx(name) {
  ensureAudio();
  if (name === 'shoot') {
    tone(800, 0.06, 'square', 0.06);
    tone(200, 0.08, 'sawtooth', 0.04, 0.01);
  } else if (name === 'shotgun') {
    tone(180, 0.2, 'square', 0.1);
    noiseBurst(0.15, 0.06);
  } else if (name === 'machinegun') {
    tone(600, 0.04, 'square', 0.04);
    noiseBurst(0.04, 0.04);
  } else if (name === 'explode') {
    tone(80, 0.4, 'sawtooth', 0.12);
    tone(60, 0.5, 'square', 0.1, 0.05);
    noiseBurst(0.4, 0.1);
  } else if (name === 'hit') {
    tone(180, 0.1, 'square', 0.07);
  } else if (name === 'enemyHit') {
    tone(420, 0.06, 'square', 0.05);
  } else if (name === 'death') {
    tone(220, 0.5, 'sawtooth', 0.1);
    tone(110, 0.7, 'sine', 0.08, 0.1);
    noiseBurst(0.5, 0.06);
  } else if (name === 'knife') {
    noiseBurst(0.05, 0.05);
    tone(1200, 0.04, 'square', 0.04);
  } else if (name === 'jump') {
    tone(180, 0.1, 'square', 0.04);
    tone(360, 0.1, 'square', 0.03, 0.05);
  } else if (name === 'explosionBig') {
    noiseBurst(0.8, 0.15);
    tone(50, 0.8, 'sawtooth', 0.15);
  } else if (name === 'pickup') {
    tone(880, 0.06, 'sine', 0.06);
    tone(1320, 0.1, 'sine', 0.05, 0.05);
  }
}

// Música ambiente industrial
let musicTimer = 0;
function playMusic() {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  if (now - musicTimer < 0.5) return;
  musicTimer = now;
  // drone grave
  tone(55 + Math.random() * 5, 0.6, 'sawtooth', 0.02);
  // batida industrial
  if (Math.random() < 0.3) {
    tone(80, 0.15, 'square', 0.04);
  }
}

// ---------- Estado do jogo ----------
const game = {
  state: 'menu', // 'menu', 'play', 'gameover', 'win'
  time: 0,
  camera: 0,
  worldWidth: 3840,
  groundY: 580,
  kills: 0,
  wave: 1,
  waveTimer: 0,
  enemiesInWave: 0,
  enemiesSpawned: 0,
  spawnTimer: 0,
  shake: 0,
  flash: 0,
};

// ---------- Player ----------
const player = {
  x: 200, y: game.groundY - 90,
  w: 36, h: 90,
  vx: 0, vy: 0,
  facing: 1,
  onGround: false,
  crouching: false,
  hp: 100, maxHp: 100,
  weapon: 'pistol',  // pistol, shotgun, machinegun
  ammo: Infinity,
  invuln: 0,         // invuln time after hit
  anim: 0,
  attacking: 0,      // knife attack timer
  dead: false,
};

// ---------- Entidades ----------
let enemies = [];
let bullets = [];      // balas do player
let enemyBullets = [];
let explosions = [];
let particles = [];
let pickups = [];
let shrapnels = [];    // pedaços
let blood = [];        // óleo/metal a sair
let groundCracks = [];
let flags = [];        // bandeiras de "resistência"

// ---------- Cenário ----------
const scenery = {
  sky: ['#1a0a0a', '#2a0e0e', '#0a0a0a'],
  buildings: [], // prédios gerados
  rubble: [],
  fires: [],
  smoke: [],
};

// Gerar cenário
function buildScenery() {
  scenery.buildings.length = 0;
  scenery.rubble.length = 0;
  scenery.fires.length = 0;
  scenery.smoke.length = 0;
  groundCracks.length = 0;

  // Prédios em ruínas
  for (let i = 0; i < 24; i++) {
    const x = i * 200 + Math.random() * 60;
    const w = 90 + Math.random() * 110;
    const h = 120 + Math.random() * 200;
    scenery.buildings.push({
      x, w, h,
      broken: Math.random() < 0.7,
      windows: Math.floor(w / 22),
      windowH: Math.floor(h / 28),
    });
  }
  // Entulho no chão
  for (let i = 0; i < 60; i++) {
    scenery.rubble.push({
      x: Math.random() * game.worldWidth,
      y: game.groundY - 10,
      w: 8 + Math.random() * 24,
      h: 6 + Math.random() * 12,
      c: Math.random() < 0.5 ? '#1a0a0a' : '#2a1414',
    });
  }
  // Fogueiras
  for (let i = 0; i < 5; i++) {
    scenery.fires.push({
      x: 200 + i * 600 + Math.random() * 200,
      y: game.groundY - 8,
      size: 16 + Math.random() * 14,
    });
  }
  // Fumo
  for (let i = 0; i < 8; i++) {
    scenery.smoke.push({
      x: 300 + i * 400 + Math.random() * 200,
      y: 100 + Math.random() * 200,
      size: 40 + Math.random() * 40,
      speed: 0.2 + Math.random() * 0.3,
      alpha: 0.3 + Math.random() * 0.3,
    });
  }
  // Rachas no chão
  for (let i = 0; i < 30; i++) {
    groundCracks.push({
      x: Math.random() * game.worldWidth,
      y: game.groundY + 20 + Math.random() * 60,
      len: 30 + Math.random() * 80,
    });
  }
  // Bandeiras da resistência
  for (let i = 0; i < 6; i++) {
    flags.push({
      x: 500 + i * 550,
      y: game.groundY - 80,
    });
  }
}
buildScenery();

// ---------- Tipos de inimigos ----------
const ENEMY_TYPES = {
  terminator: {
    name: 'T-800',
    w: 38, h: 90,
    hp: 60, speed: 1.2, dmg: 12,
    color: '#888', metal: '#ddd',
    shoot: 0.015, bulletSpeed: 5, bulletColor: '#ff3030',
    points: 100, score: 10,
  },
  hunter: {
    name: 'HK Hunter',
    w: 50, h: 70,
    hp: 100, speed: 2.4, dmg: 18,
    color: '#444', metal: '#888',
    shoot: 0.03, bulletSpeed: 7, bulletColor: '#ff8040',
    points: 200, score: 20,
  },
  tank: {
    name: 'T-1 Tank',
    w: 70, h: 80,
    hp: 220, speed: 0.5, dmg: 30,
    color: '#3a3a3a', metal: '#666',
    shoot: 0.025, bulletSpeed: 6, bulletColor: '#ff4040',
    points: 400, score: 40,
  },
  drone: {
    name: 'Aero Drone',
    w: 40, h: 24,
    hp: 30, speed: 1.6, dmg: 8,
    color: '#666', metal: '#aaa',
    shoot: 0.02, bulletSpeed: 5, bulletColor: '#ffaa00',
    points: 150, score: 15,
    flying: true,
  },
  boss: {
    name: 'T-X',
    w: 42, h: 95,
    hp: 600, speed: 1.5, dmg: 25,
    color: '#aaa', metal: '#fff',
    shoot: 0.04, bulletSpeed: 8, bulletColor: '#ff00ff',
    points: 2000, score: 200,
  },
};

// ---------- Spawn ----------
function spawnWave() {
  game.wave++;
  game.waveTimer = 0;
  game.enemiesSpawned = 0;
  game.enemiesInWave = 4 + game.wave * 2;
  game.spawnTimer = 0;
  if (game.wave % 5 === 0) {
    // boss a cada 5 waves
    spawnEnemy('boss', game.camera + W + 60);
    game.enemiesSpawned++;
  }
  flashScreen('#ff3030', 0.3);
  showMsg(`// WAVE ${game.wave} //`,
    `A Skynet enviou reforços! ${game.enemiesInWave} unidades inimigas aproximam-se.`,
    'Continuar');
}
function spawnEnemy(type, x) {
  const t = ENEMY_TYPES[type];
  const e = {
    type, x, y: t.flying ? 200 + Math.random() * 200 : game.groundY - t.h,
    w: t.w, h: t.h,
    vx: 0, vy: 0,
    hp: t.hp, maxHp: t.hp,
    color: t.color, metal: t.metal,
    speed: t.speed, dmg: t.dmg,
    shoot: t.shoot, bulletSpeed: t.bulletSpeed, bulletColor: t.bulletColor,
    points: t.points, score: t.score,
    facing: -1,
    shootTimer: 60 + Math.random() * 60,
    onGround: !t.flying,
    flying: !!t.flying,
    anim: 0,
    walk: 0,
    dead: false,
    attackMode: Math.random() < 0.5 ? 'ranged' : 'melee',
    damageFlash: 0,
  };
  enemies.push(e);
}

// ---------- Update ----------
let last = performance.now();
function update(dt) {
  if (game.state !== 'play') {
    last = performance.now();
    return;
  }
  const realDt = Math.min(50, performance.now() - last) / (1000/60);
  last = performance.now();
  game.time += realDt;
  game.shake *= 0.85;
  game.flash *= 0.9;
  if (game.flash < 0.01) game.flash = 0;
  document.getElementById('flash').style.opacity = game.flash;
  // música
  playMusic();
  // fogo e fumo
  scenery.fires.forEach(f => {
    if (Math.random() < 0.4) {
      particles.push({
        x: f.x + (Math.random() - 0.5) * f.size,
        y: f.y - Math.random() * 6,
        vy: -1 - Math.random(),
        vx: (Math.random() - 0.5) * 0.4,
        life: 30 + Math.random() * 30, maxLife: 60,
        color: Math.random() < 0.5 ? '#ff5020' : '#ffaa00',
        size: 2 + Math.random() * 3,
        type: 'flame',
      });
    }
  });
  scenery.smoke.forEach(s => {
    s.x -= s.speed;
    if (s.x < -100) s.x = game.worldWidth + 100;
  });
  // camera
  const target = player.x - W / 2 + player.w / 2;
  game.camera = Math.max(0, Math.min(game.worldWidth - W, target));
  // player
  updatePlayer(realDt);
  // balas
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx; b.y += b.vy;
    b.life -= realDt;
    if (b.life <= 0 || b.x < game.camera - 100 || b.x > game.camera + W + 100) {
      bullets.splice(i, 1); continue;
    }
    // colisão com inimigos
    for (let j = enemies.length - 1; j >= 0; j--) {
      const e = enemies[j];
      if (e.dead) continue;
      if (b.x > e.x && b.x < e.x + e.w && b.y > e.y && b.y < e.y + e.h) {
        e.hp -= b.dmg;
        e.damageFlash = 8;
        blood.push({ x: b.x, y: b.y, life: 20, color: '#ffaa00' });
        sfx('enemyHit');
        if (e.hp <= 0) {
          killEnemy(e);
        }
        if (!b.pierce) {
          bullets.splice(i, 1);
          break;
        }
      }
    }
  }
  // balas inimigas
  for (let i = enemyBullets.length - 1; i >= 0; i--) {
    const b = enemyBullets[i];
    b.x += b.vx; b.y += b.vy;
    b.life -= realDt;
    if (b.life <= 0 || b.x < game.camera - 100 || b.x > game.camera + W + 100) {
      enemyBullets.splice(i, 1); continue;
    }
    // colisão com player
    if (player.invuln <= 0 && b.x > player.x && b.x < player.x + player.w &&
        b.y > player.y && b.y < player.y + player.h) {
      damagePlayer(b.dmg);
      enemyBullets.splice(i, 1);
    }
  }
  // inimigos
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (e.dead) continue;
    e.damageFlash = Math.max(0, e.damageFlash - realDt);
    e.shootTimer -= realDt;
    e.anim += realDt;
    if (e.flying) {
      // hover
      e.y = 200 + Math.sin(e.anim * 0.05 + e.x * 0.01) * 100;
      e.x -= e.speed;
      e.facing = -1;
    } else {
      // gravidade
      e.vy += 0.5;
      e.y += e.vy;
      if (e.y + e.h >= game.groundY) {
        e.y = game.groundY - e.h;
        e.vy = 0;
        e.onGround = true;
      }
      // avançar em direcção ao player
      if (e.x > player.x + 30) {
        e.x -= e.speed;
        e.facing = -1;
        e.walk += realDt * 0.2;
      } else if (e.x + e.w < player.x - 30) {
        e.x += e.speed * 0.3;
        e.facing = 1;
        e.walk += realDt * 0.2;
      } else {
        e.walk = 0;
      }
    }
    // disparar
    if (e.shootTimer <= 0) {
      e.shootTimer = 30 + Math.random() * 60;
      shootEnemy(e);
    }
    // contacto (melee)
    if (!e.flying) {
      if (player.x + player.w > e.x && player.x < e.x + e.w &&
          player.y + player.h > e.y && player.y < e.y + e.h) {
        if (player.invuln <= 0) {
          damagePlayer(e.dmg * 0.4);
          e.shootTimer = 30;
        }
      }
    }
  }
  // explosões
  for (let i = explosions.length - 1; i >= 0; i--) {
    const e = explosions[i];
    e.r += 1.4;
    e.life -= realDt;
    if (e.life <= 0) explosions.splice(i, 1);
  }
  // sangue/óleo
  for (let i = blood.length - 1; i >= 0; i--) {
    const b = blood[i];
    b.life -= realDt;
    b.x += b.vx; b.y += b.vy;
    if (b.life <= 0) blood.splice(i, 1);
  }
  // shrapnel
  for (let i = shrapnels.length - 1; i >= 0; i--) {
    const s = shrapnels[i];
    s.x += s.vx; s.y += s.vy; s.vy += 0.2;
    s.rot += s.spin;
    s.life -= realDt;
    if (s.life <= 0 || s.y > H + 50) shrapnels.splice(i, 1);
  }
  // partículas
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    if (p.type === 'flame') {
      p.vy -= 0.04;
      p.life -= realDt;
    } else {
      p.vy += 0.2;
      p.life -= realDt;
    }
    if (p.life <= 0) particles.splice(i, 1);
  }
  // pickups
  for (let i = pickups.length - 1; i >= 0; i--) {
    const p = pickups[i];
    if (Math.abs(p.x - (player.x + player.w/2)) < 30 &&
        Math.abs(p.y - (player.y + player.h/2)) < 30) {
      if (p.type === 'health') {
        player.hp = Math.min(player.maxHp, player.hp + 30);
      } else if (p.type === 'ammo') {
        // só relevante se houver limite
      } else if (p.type === 'shotgun') player.weapon = 'shotgun';
      else if (p.type === 'machinegun') player.weapon = 'machinegun';
      sfx('pickup');
      pickups.splice(i, 1);
    }
  }
  // spawn
  game.spawnTimer -= realDt;
  if (game.enemiesSpawned < game.enemiesInWave && game.spawnTimer <= 0) {
    game.spawnTimer = 40 + Math.random() * 30;
    // Escolher tipo baseado na wave
    let types = ['terminator'];
    if (game.wave >= 2) types.push('hunter');
    if (game.wave >= 3) types.push('drone');
    if (game.wave >= 4) types.push('tank');
    if (game.wave >= 5) types.push('terminator', 'terminator');
    const t = types[Math.floor(Math.random() * types.length)];
    spawnEnemy(t, game.camera + W + 60);
    game.enemiesSpawned++;
  }
  // próxima wave
  if (game.enemiesSpawned >= game.enemiesInWave && enemies.filter(e => !e.dead).length === 0) {
    if (game.wave >= 10) {
      winGame();
    } else {
      spawnWave();
    }
  }
  // damage flash no player
  if (player.invuln > 0) player.invuln -= realDt;
  if (player.attacking > 0) {
    player.attacking -= realDt;
    // verificar hits de faca
    const range = 60;
    enemies.forEach(e => {
      if (e.dead) return;
      const cx = player.facing > 0 ? player.x + player.w : player.x;
      if (e.x < cx + range && e.x + e.w > cx - 10 && e.y + e.h > player.y && e.y < player.y + player.h) {
        if (!e._hitByKnife) {
          e._hitByKnife = true;
          e.hp -= 30;
          e.damageFlash = 8;
          blood.push({ x: player.facing > 0 ? e.x : e.x + e.w, y: player.y + 30, life: 20, color: '#ffaa00' });
          sfx('enemyHit');
          if (e.hp <= 0) killEnemy(e);
        }
      } else {
        e._hitByKnife = false;
      }
    });
  }
  // atualizar HUD
  document.getElementById('hp-text').textContent = `${Math.max(0, Math.floor(player.hp))}/${player.maxHp}`;
  document.getElementById('hp-bar').style.width = `${Math.max(0, player.hp / player.maxHp * 100)}%`;
  document.getElementById('kills').textContent = game.kills;
  document.getElementById('wave').textContent = game.wave;
}

function updatePlayer(dt) {
  if (player.dead) return;
  const acc = 0.7, max = 4.5;
  player.crouching = !!keys['arrowdown'] || !!keys['s'];
  if (player.crouching) {
    player.h = 60;
  } else {
    player.h = 90;
  }
  if (!player.crouching) {
    if (keys['arrowleft'] || keys['a']) { player.vx = -max; player.facing = -1; }
    else if (keys['arrowright'] || keys['d']) { player.vx = max; player.facing = 1; }
    else player.vx *= 0.7;
  } else {
    player.vx *= 0.5;
  }
  // saltar
  if ((keys['arrowup'] || keys['w'] || keys['space']) && player.onGround && !player.crouching) {
    player.vy = -14;
    player.onGround = false;
    sfx('jump');
  }
  player.vy += 0.6;
  player.x += player.vx;
  player.y += player.vy;
  // chão
  if (player.y + player.h >= game.groundY) {
    player.y = game.groundY - player.h;
    player.vy = 0;
    player.onGround = true;
  } else {
    player.onGround = false;
  }
  if (player.x < 0) player.x = 0;
  if (player.x > game.worldWidth - player.w) player.x = game.worldWidth - player.w;
  player.anim += Math.abs(player.vx) * 0.1;
  // disparar
  if (player._shootCooldown === undefined) player._shootCooldown = 0;
  player._shootCooldown -= dt;
  if (player._shootCooldown <= 0) {
    if (keys['z'] || keys['j']) {
      shoot();
    } else if (keys['c'] || keys['l']) {
      knife();
    } else if (keys['x'] || keys['k']) {
      grenade();
    }
  }
  // auto-disparo machinegun
  if ((keys['z'] || keys['j']) && player.weapon === 'machinegun' && player._shootCooldown <= 0) {
    // já disparou
  }
}

function shoot() {
  const cx = player.facing > 0 ? player.x + player.w - 4 : player.x + 4;
  const cy = player.y + (player.crouching ? 50 : 30);
  if (player.weapon === 'pistol') {
    bullets.push({ x: cx, y: cy, vx: player.facing * 12, vy: 0, dmg: 15, life: 50, color: '#ffeb3b' });
    sfx('shoot');
    player._shootCooldown = 14;
    // muzzle flash
    particles.push({ x: cx + player.facing * 8, y: cy, vx: 0, vy: 0, life: 4, maxLife: 4, color: '#ffff00', size: 8, type: 'flash' });
  } else if (player.weapon === 'shotgun') {
    for (let i = -2; i <= 2; i++) {
      bullets.push({ x: cx, y: cy, vx: player.facing * 9, vy: i * 1.2, dmg: 14, life: 30, color: '#ffeb3b' });
    }
    sfx('shotgun');
    player._shootCooldown = 36;
    game.shake = 5;
    particles.push({ x: cx + player.facing * 8, y: cy, vx: 0, vy: 0, life: 6, maxLife: 6, color: '#ffaa00', size: 12, type: 'flash' });
  } else if (player.weapon === 'machinegun') {
    bullets.push({ x: cx, y: cy, vx: player.facing * 14, vy: (Math.random() - 0.5) * 1.5, dmg: 12, life: 40, color: '#ffeb3b' });
    sfx('machinegun');
    player._shootCooldown = 6;
    particles.push({ x: cx + player.facing * 8, y: cy, vx: 0, vy: 0, life: 3, maxLife: 3, color: '#ffffaa', size: 6, type: 'flash' });
  }
}
function knife() {
  if (player.attacking > 0) return;
  player.attacking = 20;
  sfx('knife');
  // slash visual
  const cx = player.facing > 0 ? player.x + player.w + 10 : player.x - 10;
  particles.push({ x: cx, y: player.y + 30, vx: 0, vy: 0, life: 12, maxLife: 12, color: '#ffffff', size: 30, type: 'slash' });
  player._shootCooldown = 18;
}
function grenade() {
  // granada
  if (player._grenadeCooldown > 0) return;
  player._grenadeCooldown = 60;
  const cx = player.facing > 0 ? player.x + player.w : player.x;
  const cy = player.y + 20;
  particles.push({
    x: cx, y: cy, vx: player.facing * 4, vy: -8,
    life: 60, maxLife: 60, type: 'grenade', color: '#444',
  });
  setTimeout(() => {
    // explodir
    flashScreen('#ff5020', 0.5);
    game.shake = 14;
    sfx('explode');
    const ex = cx + player.facing * 60;
    const ey = game.groundY;
    explosions.push({ x: ex, y: ey, r: 0, maxR: 80, life: 20, color: '#ff8030' });
    explosions.push({ x: ex, y: ey, r: 0, maxR: 50, life: 14, color: '#ffeb3b' });
    // danificar inimigos
    enemies.forEach(e => {
      if (e.dead) return;
      const d = Math.hypot(e.x + e.w/2 - ex, e.y + e.h/2 - ey);
      if (d < 80) {
        e.hp -= 60 * (1 - d / 80);
        e.damageFlash = 12;
        if (e.hp <= 0) killEnemy(e);
      }
    });
    // shrapnel
    for (let i = 0; i < 14; i++) {
      const a = (i / 14) * Math.PI * 2;
      shrapnels.push({
        x: ex, y: ey, vx: Math.cos(a) * 4, vy: Math.sin(a) * 4,
        rot: 0, spin: -0.2 + Math.random() * 0.4,
        life: 40, color: '#888', size: 3,
      });
    }
  }, 1000);
}
function shootEnemy(e) {
  const cx = e.x + e.w / 2;
  const cy = e.y + e.h / 2;
  let dx = player.x + player.w/2 - cx;
  let dy = player.y + player.h/2 - cy;
  const d = Math.hypot(dx, dy) || 1;
  dx /= d; dy /= d;
  enemyBullets.push({
    x: cx, y: cy, vx: dx * e.bulletSpeed, vy: dy * e.bulletSpeed,
    dmg: e.dmg, life: 100, color: e.bulletColor,
  });
  // muzzle flash
  particles.push({ x: cx, y: cy, vx: 0, vy: 0, life: 4, maxLife: 4, color: e.bulletColor, size: 6, type: 'flash' });
}
function damagePlayer(dmg) {
  if (player.invuln > 0) return;
  player.hp -= dmg;
  player.invuln = 30;
  game.shake = 4;
  sfx('hit');
  flashScreen('#ff0000', 0.3);
  if (player.hp <= 0) {
    player.hp = 0;
    playerDead();
  }
}
function killEnemy(e) {
  e.dead = true;
  game.kills += e.score;
  // explosão
  sfx('explode');
  const ex = e.x + e.w/2, ey = e.y + e.h/2;
  explosions.push({ x: ex, y: ey, r: 0, maxR: 40, life: 20, color: '#ff8030' });
  explosions.push({ x: ex, y: ey, r: 0, maxR: 20, life: 12, color: '#ffeb3b' });
  // shrapnel
  for (let i = 0; i < 10; i++) {
    const a = Math.random() * Math.PI * 2;
    shrapnels.push({
      x: ex, y: ey, vx: Math.cos(a) * (1 + Math.random() * 3),
      vy: Math.sin(a) * (1 + Math.random() * 3) - 1,
      rot: 0, spin: -0.2 + Math.random() * 0.4,
      life: 50, color: e.metal, size: 2 + Math.random() * 3,
    });
  }
  // óleo
  for (let i = 0; i < 8; i++) {
    blood.push({
      x: ex, y: ey,
      vx: (Math.random() - 0.5) * 4, vy: -2 - Math.random() * 2,
      life: 30, color: e.type === 'hunter' ? '#ff8000' : '#ffaa00',
    });
  }
  // chance de drop
  if (Math.random() < 0.25) {
    const r = Math.random();
    if (r < 0.5) pickups.push({ x: ex, y: ey, type: 'health' });
    else if (r < 0.8) pickups.push({ x: ex, y: ey, type: 'shotgun' });
    else pickups.push({ x: ex, y: ey, type: 'machinegun' });
  }
  // remove
  setTimeout(() => {
    const i = enemies.indexOf(e);
    if (i >= 0) enemies.splice(i, 1);
  }, 100);
}
function playerDead() {
  if (player.dead) return;
  player.dead = true;
  sfx('death');
  game.shake = 12;
  flashScreen('#ff0000', 0.8);
  explosions.push({ x: player.x + player.w/2, y: player.y + player.h/2, r: 0, maxR: 80, life: 30, color: '#ff5030' });
  explosions.push({ x: player.x + player.w/2, y: player.y + player.h/2, r: 0, maxR: 40, life: 20, color: '#ffeb3b' });
  for (let i = 0; i < 16; i++) {
    shrapnels.push({
      x: player.x + player.w/2, y: player.y + player.h/2,
      vx: (Math.random() - 0.5) * 6, vy: -2 - Math.random() * 4,
      rot: 0, spin: -0.2 + Math.random() * 0.4,
      life: 60, color: '#888', size: 3,
    });
  }
  setTimeout(() => {
    game.state = 'gameover';
    showMsg('// VOCÊ MORREU //',
      `A Skynet venceu desta vez. Eliminaste <b>${game.kills}</b> máquinas e chegaste à <b>Wave ${game.wave}</b>.<br><br><span class="quote">"The machines have won."</span>`,
      'Recomeçar');
  }, 1500);
}
function winGame() {
  game.state = 'win';
  showMsg('// VITÓRIA //',
    `Destruíste o exército da Skynet! <b>${game.kills}</b> eliminações em ${game.wave} waves.<br><br><span class="quote">"No fate but what we make."</span>`,
    'Jogar novamente');
}
function flashScreen(color, alpha) {
  const f = document.getElementById('flash');
  f.style.background = color;
  game.flash = alpha;
}

// ---------- Desenho ----------
function draw() {
  // shake
  ctx.save();
  if (game.shake > 0.1) {
    ctx.translate((Math.random() - 0.5) * game.shake, (Math.random() - 0.5) * game.shake);
  }
  drawSky();
  ctx.save();
  ctx.translate(-game.camera, 0);
  drawScenery();
  drawExplosions();
  drawPickups();
  drawEnemies();
  drawPlayer();
  drawBullets();
  drawBlood();
  drawShrapnel();
  drawParticles();
  ctx.restore();
  drawHUD2();
  if (player.dead) drawVignette();
  ctx.restore();
}
function drawVignette() {
  const v = ctx.createRadialGradient(W/2, H/2, 100, W/2, H/2, 600);
  v.addColorStop(0, 'rgba(255,0,0,0)');
  v.addColorStop(1, 'rgba(255,0,0,0.7)');
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, W, H);
}
function drawSky() {
  // céu apocalíptico
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#1a0606');
  g.addColorStop(0.5, '#3a1a0a');
  g.addColorStop(0.85, '#5a2a0e');
  g.addColorStop(1, '#7a3a14');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  // estrelas vermelhas
  for (let i = 0; i < 50; i++) {
    const x = (i * 137) % W;
    const y = (i * 79) % 250;
    ctx.fillStyle = `rgba(255,${100 + (i % 3) * 30},${50 + (i % 5) * 20},${0.3 + (i % 4) * 0.1})`;
    ctx.fillRect(x, y, 1.5, 1.5);
  }
  // fumo de fundo
  scenery.smoke.forEach(s => {
    const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.size);
    g.addColorStop(0, `rgba(60, 30, 30, ${s.alpha})`);
    g.addColorStop(1, 'rgba(60, 30, 30, 0)');
    ctx.fillStyle = g;
    ctx.fillRect(s.x - s.size, s.y - s.size, s.size * 2, s.size * 2);
  });
  // relâmpagos ocasionais
  if (Math.random() < 0.005) {
    ctx.fillStyle = 'rgba(255, 100, 50, 0.3)';
    ctx.fillRect(0, 0, W, H);
  }
}
function drawScenery() {
  // prédios (fundo)
  scenery.buildings.forEach(b => {
    const x = b.x;
    const y = game.groundY - b.h;
    // silhueta
    ctx.fillStyle = '#0a0a0a';
    ctx.fillRect(x, y, b.w, b.h);
    // contorno vermelho
    ctx.strokeStyle = '#3a1a1a';
    ctx.lineWidth = 1;
    ctx.strokeRect(x, y, b.w, b.h);
    // janelas
    for (let wy = 0; wy < b.windowH; wy++) {
      for (let wx = 0; wx < b.windows; wx++) {
        if (Math.random() < 0.7) {
          const wxPos = x + 8 + wx * 22;
          const wyPos = y + 12 + wy * 28;
          const lit = Math.random() < 0.4;
          ctx.fillStyle = lit ? `rgba(255, 100, 50, ${0.4 + Math.random() * 0.4})` : 'rgba(0,0,0,0.8)';
          ctx.fillRect(wxPos, wyPos, 14, 18);
        }
      }
    }
    // rachas
    if (b.broken) {
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.moveTo(x + b.w * 0.7, y);
      ctx.lineTo(x + b.w * 0.5, y + b.h * 0.5);
      ctx.lineTo(x + b.w * 0.6, y + b.h);
      ctx.closePath();
      ctx.fill();
    }
  });
  // chão
  ctx.fillStyle = '#2a1a0e';
  ctx.fillRect(0, game.groundY, game.worldWidth, H - game.groundY);
  // textura
  ctx.fillStyle = '#3a2418';
  for (let i = 0; i < 80; i++) {
    const x = (i * 113) % game.worldWidth;
    ctx.fillRect(x, game.groundY + (i % 7) * 16, 4, 2);
  }
  // rachas
  ctx.strokeStyle = '#1a0a0a';
  ctx.lineWidth = 1;
  groundCracks.forEach(c => {
    ctx.beginPath();
    ctx.moveTo(c.x, c.y);
    ctx.lineTo(c.x + c.len, c.y + 2);
    ctx.stroke();
  });
  // entulho
  scenery.rubble.forEach(r => {
    ctx.fillStyle = r.c;
    ctx.fillRect(r.x, game.groundY - r.h + 2, r.w, r.h);
  });
  // bandeiras
  flags.forEach(f => {
    // mastro
    ctx.fillStyle = '#888';
    ctx.fillRect(f.x, f.y, 2, 80);
    // bandeira
    ctx.fillStyle = '#cc1f1f';
    ctx.beginPath();
    ctx.moveTo(f.x + 2, f.y);
    ctx.lineTo(f.x + 30, f.y + 6);
    ctx.lineTo(f.x + 2, f.y + 12);
    ctx.closePath();
    ctx.fill();
    // caveira
    ctx.fillStyle = '#fff';
    ctx.fillRect(f.x + 8, f.y + 3, 4, 4);
    ctx.fillRect(f.x + 14, f.y + 3, 4, 4);
    ctx.fillRect(f.x + 10, f.y + 7, 6, 2);
  });
  // fogueiras
  scenery.fires.forEach(f => {
    const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.size * 2);
    g.addColorStop(0, 'rgba(255, 200, 50, 0.7)');
    g.addColorStop(0.5, 'rgba(255, 80, 20, 0.4)');
    g.addColorStop(1, 'rgba(255, 0, 0, 0)');
    ctx.fillStyle = g;
    ctx.fillRect(f.x - f.size*2, f.y - f.size*2, f.size*4, f.size*4);
    // chamas
    ctx.fillStyle = '#ff8020';
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.size * 0.5, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#ffeb3b';
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.size * 0.25, 0, Math.PI*2);
    ctx.fill();
  });
}

function drawEnemies() {
  enemies.forEach(e => {
    if (e.dead) return;
    ctx.save();
    const shake = e.damageFlash > 0 ? (Math.random() - 0.5) * 4 : 0;
    ctx.translate(e.x + e.w/2 + shake, e.y + e.h/2);
    if (e.facing < 0) ctx.scale(-1, 1);
    // piscar quando dano
    if (e.damageFlash > 0) ctx.globalAlpha = 0.7 + Math.random() * 0.3;
    drawRobot(e);
    ctx.restore();
    // barra de vida para inimigos grandes
    if (e.type === 'tank' || e.type === 'boss') {
      const barW = e.w;
      ctx.fillStyle = '#000';
      ctx.fillRect(e.x, e.y - 8, barW, 4);
      ctx.fillStyle = '#ff3030';
      ctx.fillRect(e.x, e.y - 8, barW * (e.hp / e.maxHp), 4);
    }
  });
}
function drawRobot(e) {
  const t = e.anim * 0.1;
  if (e.type === 'drone') {
    // drone voador
    ctx.fillStyle = '#444';
    ctx.fillRect(-20, -10, 40, 16);
    ctx.fillStyle = '#888';
    ctx.fillRect(-18, -12, 36, 4);
    // hélices
    ctx.save();
    ctx.translate(-18, 0);
    ctx.rotate(e.anim * 0.5);
    ctx.fillStyle = 'rgba(180,180,180,0.4)';
    ctx.fillRect(-2, -10, 4, 20);
    ctx.restore();
    ctx.save();
    ctx.translate(18, 0);
    ctx.rotate(-e.anim * 0.5);
    ctx.fillStyle = 'rgba(180,180,180,0.4)';
    ctx.fillRect(-2, -10, 4, 20);
    ctx.restore();
    // olho
    ctx.fillStyle = '#ff0000';
    ctx.beginPath();
    ctx.arc(10, -2, 3, 0, Math.PI*2);
    ctx.fill();
    // luz vermelha
    ctx.fillStyle = 'rgba(255,0,0,0.3)';
    ctx.beginPath();
    ctx.arc(15, 0, 12, 0, Math.PI*2);
    ctx.fill();
    return;
  }
  // pernas
  const leg = Math.sin(e.walk * 4) * 6;
  ctx.fillStyle = '#444';
  ctx.fillRect(-14, 25, 8, 20);
  ctx.fillRect(6 - leg * 0.3, 25, 8, 20);
  // corpo
  ctx.fillStyle = e.color;
  ctx.fillRect(-18, 0, 36, 30);
  // detalhes mecânicos
  ctx.fillStyle = '#222';
  ctx.fillRect(-18, 10, 36, 4);
  // luzes
  ctx.fillStyle = '#ff0000';
  ctx.fillRect(-8, 14, 4, 2);
  ctx.fillStyle = '#ff0000';
  ctx.beginPath();
  ctx.arc(8, 16, 2, 0, Math.PI*2);
  ctx.fill();
  // cabeça
  ctx.fillStyle = e.metal;
  ctx.fillRect(-10, -20, 20, 20);
  // olhos vermelhos brilhantes
  ctx.fillStyle = '#ff0000';
  ctx.beginPath();
  ctx.arc(-4, -12, 2, 0, Math.PI*2);
  ctx.arc(5, -12, 2, 0, Math.PI*2);
  ctx.fill();
  // brilho
  ctx.fillStyle = 'rgba(255, 0, 0, 0.5)';
  ctx.beginPath();
  ctx.arc(-4, -12, 4, 0, Math.PI*2);
  ctx.arc(5, -12, 4, 0, Math.PI*2);
  ctx.fill();
  // mandíbula metálica
  ctx.fillStyle = '#666';
  ctx.fillRect(-8, -3, 16, 3);
  // boca/jaw para bosses
  if (e.type === 'boss') {
    ctx.fillStyle = '#ff00ff';
    ctx.fillRect(-6, -5, 4, 2);
    ctx.fillRect(2, -5, 4, 2);
  }
  // braço armado
  ctx.fillStyle = e.metal;
  ctx.save();
  ctx.translate(18, 5);
  ctx.rotate(-0.3);
  ctx.fillRect(0, -3, 20, 6);
  // arma
  ctx.fillStyle = '#222';
  ctx.fillRect(15, -4, 8, 8);
  ctx.restore();
  // ombro
  ctx.fillStyle = e.color;
  ctx.fillRect(16, -2, 6, 8);
  // cauda/tanque
  if (e.type === 'tank') {
    ctx.fillStyle = '#222';
    ctx.fillRect(-30, 8, 12, 20);
  }
}
function drawPlayer() {
  if (player.dead && game.time % 4 < 2) return;
  ctx.save();
  const shake = player.invuln > 0 ? (Math.random() - 0.5) * 3 : 0;
  ctx.translate(player.x + player.w/2 + shake, player.y + player.h/2);
  if (player.facing < 0) ctx.scale(-1, 1);
  const walk = player.onGround ? Math.sin(player.anim * 0.5) * 4 * Math.min(1, Math.abs(player.vx) / 4) : 0;
  // pernas
  ctx.fillStyle = '#1a1a1a';
  ctx.fillRect(-12, 18, 8, 28 + walk);
  ctx.fillRect(4, 18, 8, 28 - walk);
  // botas
  ctx.fillStyle = '#000';
  ctx.fillRect(-14, 44, 12, 6);
  ctx.fillRect(2, 44, 12, 6);
  // tronco
  ctx.fillStyle = '#1a0808';
  ctx.fillRect(-16, -4, 32, 26);
  // colete (couro)
  ctx.fillStyle = '#2a1414';
  ctx.fillRect(-16, 0, 32, 22);
  // correias
  ctx.fillStyle = '#3a2424';
  ctx.fillRect(-16, 6, 32, 2);
  ctx.fillRect(-16, 14, 32, 2);
  // coldre
  ctx.fillStyle = '#000';
  ctx.fillRect(-18, 8, 6, 14);
  // cabeça
  ctx.fillStyle = '#d4a070';
  ctx.beginPath();
  ctx.arc(0, -18, 12, 0, Math.PI*2);
  ctx.fill();
  // cabelo
  ctx.fillStyle = '#1a0a0a';
  ctx.beginPath();
  ctx.arc(0, -22, 12, Math.PI, 0);
  ctx.fill();
  // olhos
  ctx.fillStyle = '#fff';
  ctx.fillRect(-5, -19, 3, 2);
  ctx.fillRect(2, -19, 3, 2);
  ctx.fillStyle = '#000';
  ctx.fillRect(-4, -19, 1.5, 2);
  ctx.fillRect(3, -19, 1.5, 2);
  // cicatriz
  ctx.strokeStyle = '#a04040';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(-7, -22);
  ctx.lineTo(-4, -16);
  ctx.stroke();
  // boca
  ctx.fillStyle = '#3a1a1a';
  ctx.fillRect(-3, -12, 6, 1);
  // braço armado
  ctx.save();
  ctx.translate(16, 4);
  if (keys['z'] || keys['j'] || (player.attacking > 0)) {
    ctx.rotate(-0.4);
  } else {
    ctx.rotate(-0.1);
  }
  // braço
  ctx.fillStyle = '#d4a070';
  ctx.fillRect(0, -2, 6, 12);
  // mão
  ctx.fillStyle = '#a06040';
  ctx.fillRect(0, 8, 6, 4);
  // arma
  ctx.fillStyle = '#1a1a1a';
  if (player.weapon === 'pistol') {
    ctx.fillRect(4, -4, 16, 8);
    ctx.fillRect(8, -7, 10, 4);
  } else if (player.weapon === 'shotgun') {
    ctx.fillRect(4, -3, 20, 10);
    ctx.fillRect(6, 4, 18, 4);
  } else if (player.weapon === 'machinegun') {
    ctx.fillRect(4, -3, 24, 8);
    ctx.fillRect(2, 5, 8, 6);
    ctx.fillRect(8, 4, 20, 4);
  }
  ctx.restore();
  // braço esquerdo
  ctx.fillStyle = '#1a0808';
  ctx.save();
  ctx.translate(-16, 4);
  ctx.rotate(0.2);
  ctx.fillRect(-6, -2, 8, 14);
  ctx.fillStyle = '#d4a070';
  ctx.fillRect(-6, 10, 6, 4);
  ctx.restore();
  // efeito de faca
  if (player.attacking > 0) {
    ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
    ctx.beginPath();
    ctx.arc(28, 6, 16, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
  // barra de vida
  if (!player.dead) {
    ctx.fillStyle = '#000';
    ctx.fillRect(player.x, player.y - 10, player.w, 4);
    ctx.fillStyle = player.hp > 30 ? '#ff3030' : '#ff0000';
    ctx.fillRect(player.x, player.y - 10, player.w * (player.hp / player.maxHp), 4);
  }
}
function drawBullets() {
  bullets.forEach(b => {
    // trail
    ctx.strokeStyle = b.color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(b.x - b.vx * 0.5, b.y - b.vy * 0.5);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
    // bullet
    ctx.fillStyle = b.color;
    ctx.shadowColor = b.color;
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(b.x, b.y, 2.5, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;
  });
  enemyBullets.forEach(b => {
    ctx.fillStyle = b.color;
    ctx.shadowColor = b.color;
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(b.x, b.y, 3, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;
  });
}
function drawExplosions() {
  explosions.forEach(e => {
    const alpha = e.life / 20;
    ctx.fillStyle = `rgba(255, ${100 + Math.random()*100}, 0, ${alpha * 0.6})`;
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.r, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = `rgba(255, 255, 200, ${alpha * 0.8})`;
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.r * 0.5, 0, Math.PI*2);
    ctx.fill();
  });
}
function drawShrapnel() {
  shrapnels.forEach(s => {
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(s.rot);
    ctx.fillStyle = s.color;
    ctx.fillRect(-s.size / 2, -s.size / 2, s.size, s.size);
    ctx.restore();
  });
}
function drawBlood() {
  blood.forEach(b => {
    ctx.fillStyle = b.color;
    ctx.globalAlpha = b.life / 30;
    ctx.beginPath();
    ctx.arc(b.x, b.y, 2, 0, Math.PI*2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
}
function drawParticles() {
  particles.forEach(p => {
    if (p.type === 'flash') {
      ctx.fillStyle = p.color;
      ctx.globalAlpha = p.life / p.maxLife;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * (p.life / p.maxLife), 0, Math.PI*2);
      ctx.fill();
    } else if (p.type === 'flame') {
      ctx.fillStyle = p.color;
      ctx.globalAlpha = p.life / p.maxLife;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
      ctx.fill();
    } else if (p.type === 'slash') {
      ctx.strokeStyle = p.color;
      ctx.lineWidth = 3;
      ctx.globalAlpha = p.life / p.maxLife;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * (1 - p.life / p.maxLife), 0, Math.PI);
      ctx.stroke();
    } else if (p.type === 'grenade') {
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 5, 0, Math.PI*2);
      ctx.fill();
    }
  });
  ctx.globalAlpha = 1;
}
function drawPickups() {
  pickups.forEach(p => {
    if (p.type === 'health') {
      ctx.fillStyle = '#ff3030';
      ctx.fillRect(p.x - 8, p.y - 8, 16, 16);
      ctx.fillStyle = '#fff';
      ctx.fillRect(p.x - 1, p.y - 6, 2, 12);
      ctx.fillRect(p.x - 6, p.y - 1, 12, 2);
    } else if (p.type === 'shotgun') {
      ctx.fillStyle = '#888';
      ctx.fillRect(p.x - 10, p.y - 4, 20, 8);
      ctx.fillStyle = '#444';
      ctx.fillRect(p.x - 8, p.y + 4, 16, 4);
    } else if (p.type === 'machinegun') {
      ctx.fillStyle = '#666';
      ctx.fillRect(p.x - 12, p.y - 4, 24, 8);
      ctx.fillStyle = '#333';
      ctx.fillRect(p.x - 8, p.y + 4, 20, 4);
    }
    // brilho
    ctx.strokeStyle = 'rgba(255, 255, 100, 0.5)';
    ctx.lineWidth = 1;
    ctx.strokeRect(p.x - 12, p.y - 12, 24, 24);
  });
}
function drawHUD2() {
  // texto de weapon
  const wName = { pistol: 'PISTOLA', shotgun: 'ESPINGARDA', machinegun: 'METRALHADORA' };
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(10, H - 80, 220, 60);
  ctx.strokeStyle = '#ff3030';
  ctx.lineWidth = 1;
  ctx.strokeRect(10, H - 80, 220, 60);
  ctx.fillStyle = '#ff3030';
  ctx.font = 'bold 14px "Courier New", monospace';
  ctx.fillText('// ARMA', 20, H - 60);
  ctx.font = 'bold 20px "Courier New", monospace';
  ctx.fillText(wName[player.weapon], 20, H - 38);
  ctx.restore();
}

// ---------- Input ----------
const keys = {};
document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (e.key === ' ') { keys['space'] = true; e.preventDefault(); }
  if (k === 'r') {
    resetGame();
    hideMsg();
  }
    if (k === 'x') {
	chrome.webview.postMessage('home');
  }
  ensureAudio();
});
document.addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  keys[k] = false;
  if (e.key === ' ') keys['space'] = false;
});

// ---------- Mensagens ----------
const msgEl = document.getElementById('message');
const msgBtn = document.getElementById('msg-button');
const msgTitle = document.getElementById('msg-title');
const msgText = document.getElementById('msg-text');
function showMsg(title, text, btn = 'Continuar') {
  msgTitle.textContent = title;
  msgText.innerHTML = text;
  msgBtn.textContent = btn;
  msgEl.classList.remove('hidden');
}
function hideMsg() {
  msgEl.classList.add('hidden');
}
msgBtn.addEventListener('click', () => {
  hideMsg();
  ensureAudio();
  if (game.state === 'menu' || game.state === 'gameover' || game.state === 'win') {
    startGame();
  }
});

function startGame() {
  game.state = 'play';
  player.hp = 100;
  player.x = 200;
  player.y = game.groundY - 90;
  player.vx = 0; player.vy = 0;
  player.dead = false;
  player.weapon = 'pistol';
  game.kills = 0;
  game.wave = 0;
  enemies.length = 0;
  bullets.length = 0;
  enemyBullets.length = 0;
  explosions.length = 0;
  particles.length = 0;
  shrapnels.length = 0;
  pickups.length = 0;
  blood.length = 0;
  spawnWave();
  last = performance.now();
}
function resetGame() {
  startGame();
}

// ---------- Loop ----------
function loop(now) {
  update(now);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
